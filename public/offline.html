<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIZAN - Mode Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #FAF7EE;
      color: #1B4D3E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #FFFFFF;
      border-radius: 1.25rem;
      padding: 2.25rem 1.75rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(27, 77, 62, 0.08), 0 8px 10px -6px rgba(27, 77, 62, 0.04);
      border: 1px solid rgba(197, 160, 89, 0.25);
    }
    .badge {
      display: inline-block;
      background: rgba(197, 160, 89, 0.15);
      color: #8C6D28;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .icon-box {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      background: #1B4D3E;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FAF7EE;
      box-shadow: 0 4px 12px rgba(27, 77, 62, 0.25);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #1B4D3E;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #4A635B;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: block;
      width: 100%;
      background: #1B4D3E;
      color: #FFFFFF;
      border: none;
      padding: 0.875rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: opacity 0.2s;
      text-decoration: none;
    }
    .btn:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Offline</div>
    <div class="icon-box">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>Mode Luar Jaringan</h1>
    <p>Aplikasi tetap menyimpan data dan sesi Anda di ponsel. Data terbaru akan disinkronkan saat terhubung kembali.</p>
    <button class="btn" onclick="window.location.reload()">Muat</button>
  </div>
  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
