<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS Admin - Pondok Pesantren Modern Raudhatussalam Mahato</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e2e8f0;
        border-top-color: #0f766e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .loader-text {
        margin-top: 16px;
        font-size: 14px;
        color: #64748b;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #initial-loader { background-color: #020617; }
        .spinner { border-color: #1e293b; border-top-color: #2dd4bf; }
        .loader-text { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div class="loader-text">Memuat Sistem Admin...</div>
      </div>
    </div>
    <script type="module" src="/src/admin-main.tsx"></script>
  </body>
</html>
